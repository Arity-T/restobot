apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: restobot-postgres-data
  namespace: restobot
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: restobot-postgres
  namespace: restobot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: restobot-postgres
  template:
    metadata:
      labels:
        app: restobot-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: main
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: restobot-app-env
                  key: MAIN_DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: restobot-app-env
                  key: MAIN_DB_PASSWORD
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: restobot-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: restobot-postgres
  namespace: restobot
spec:
  selector:
    app: restobot-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
