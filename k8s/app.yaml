apiVersion: apps/v1
kind: Deployment
metadata:
  name: restobot-app
  namespace: restobot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: restobot-app
  template:
    metadata:
      labels:
        app: restobot-app
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: MAIN_DB_USER
              valueFrom:
                secretKeyRef:
                  name: restobot-app-env
                  key: MAIN_DB_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: restobot-app-env
                  key: MAIN_DB_PASSWORD
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              until pg_isready -h restobot-postgres -p 5432 -U "$MAIN_DB_USER" -d main; do
                echo "Waiting for PostgreSQL..."
                sleep 5
              done
      containers:
        - name: restobot-app
          image: restobot-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8089
              name: http
          env:
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: restobot-app-env
                  key: TELEGRAM_BOT_TOKEN
            - name: TELEGRAM_BOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: restobot-app-env
                  key: TELEGRAM_BOT_USERNAME
            - name: MAIN_DB_URL
              value: jdbc:postgresql://restobot-postgres:5432/main
            - name: MAIN_DB_USER
              valueFrom:
                secretKeyRef:
                  name: restobot-app-env
                  key: MAIN_DB_USER
            - name: MAIN_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: restobot-app-env
                  key: MAIN_DB_PASSWORD
            - name: TRIPADVISOR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: restobot-app-env
                  key: TRIPADVISOR_API_KEY
            - name: TRIPADVISOR_API_HOST
              valueFrom:
                secretKeyRef:
                  name: restobot-app-env
                  key: TRIPADVISOR_API_HOST
            - name: TRIPADVISOR_API_LANGUAGE
              valueFrom:
                secretKeyRef:
                  name: restobot-app-env
                  key: TRIPADVISOR_API_LANGUAGE
            - name: API_SERVER_HOST
              value: 0.0.0.0
            - name: API_SERVER_PORT
              value: "8089"
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: restobot-app
  namespace: restobot
spec:
  type: NodePort
  selector:
    app: restobot-app
  ports:
    - name: http
      port: 8089
      targetPort: http
      nodePort: 30089
