---
- name: Prepare VM and deploy RestoBot via Docker Compose
  hosts: restobot
  become: true
  vars:
    restobot_deploy_path: /opt/restobot
    restobot_owner: "{{ ansible_user | default('restobot') }}"
    restobot_app_port: 8089

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install base system packages
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - python3
          - python3-apt
          - software-properties-common
        state: present

    - name: Create Docker keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker repository key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Configure Docker APT repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker Engine and Compose plugin
      ansible.builtin.apt:
        update_cache: true
        name:
          - containerd.io
          - docker-buildx-plugin
          - docker-ce
          - docker-ce-cli
          - docker-compose-plugin
        state: present

    - name: Ensure Docker service is enabled and running
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started

    - name: Add deployment user to docker group
      ansible.builtin.user:
        name: "{{ restobot_owner }}"
        groups: docker
        append: true

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ restobot_deploy_path }}"
        state: directory
        owner: "{{ restobot_owner }}"
        group: "{{ restobot_owner }}"
        mode: "0755"

    - name: Upload docker-compose file
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../docker-compose.yml"
        dest: "{{ restobot_deploy_path }}/docker-compose.yml"
        owner: "{{ restobot_owner }}"
        group: "{{ restobot_owner }}"
        mode: "0644"

    - name: Upload environment file
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../.env"
        dest: "{{ restobot_deploy_path }}/.env"
        owner: "{{ restobot_owner }}"
        group: "{{ restobot_owner }}"
        mode: "0600"

    - name: Normalize environment file line endings
      ansible.builtin.shell:
        cmd: sed -i 's/\r$//' "{{ restobot_deploy_path }}/.env"
      changed_when: false

    - name: Ensure API server binds to all interfaces
      ansible.builtin.lineinfile:
        path: "{{ restobot_deploy_path }}/.env"
        regexp: '^API_SERVER_HOST='
        line: "API_SERVER_HOST=0.0.0.0"
        create: true

    - name: Upload DB migration V1
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../logic/src/main/resources/db/migration/main/V1__init_main.sql"
        dest: "{{ restobot_deploy_path }}/V1__init_main.sql"
        owner: "{{ restobot_owner }}"
        group: "{{ restobot_owner }}"
        mode: "0644"

    - name: Upload DB migration V2
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../logic/src/main/resources/db/migration/main/V2__add_data.sql"
        dest: "{{ restobot_deploy_path }}/V2__add_data.sql"
        owner: "{{ restobot_owner }}"
        group: "{{ restobot_owner }}"
        mode: "0644"

    - name: Pull application images
      ansible.builtin.command:
        cmd: docker compose pull
        chdir: "{{ restobot_deploy_path }}"
      changed_when: false

    - name: Start PostgreSQL container
      ansible.builtin.command:
        cmd: docker compose up -d postgres
        chdir: "{{ restobot_deploy_path }}"
      changed_when: false

    - name: Wait until PostgreSQL is ready
      ansible.builtin.shell:
        cmd: docker compose exec -T postgres sh -lc 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
        chdir: "{{ restobot_deploy_path }}"
      register: pg_ready
      retries: 20
      delay: 3
      until: pg_ready.rc == 0
      changed_when: false

    - name: Check if city table exists
      ansible.builtin.shell:
        cmd: docker compose exec -T postgres sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT to_regclass(\$\$public.city\$\$) IS NOT NULL;"'
        chdir: "{{ restobot_deploy_path }}"
      register: city_table_exists
      changed_when: false

    - name: Apply schema migration V1 when schema is missing
      ansible.builtin.shell:
        cmd: docker compose exec -T postgres sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB"' < "{{ restobot_deploy_path }}/V1__init_main.sql"
        chdir: "{{ restobot_deploy_path }}"
      when: city_table_exists.stdout | trim != "t"

    - name: Count rows in city table
      ansible.builtin.shell:
        cmd: docker compose exec -T postgres sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT COUNT(*) FROM city;"'
        chdir: "{{ restobot_deploy_path }}"
      register: city_count
      changed_when: false

    - name: Apply seed migration V2 when city table is empty
      ansible.builtin.shell:
        cmd: docker compose exec -T postgres sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB"' < "{{ restobot_deploy_path }}/V2__add_data.sql"
        chdir: "{{ restobot_deploy_path }}"
      when: (city_count.stdout | trim | int) == 0

    - name: Start RestoBot app container
      ansible.builtin.command:
        cmd: docker compose up -d --force-recreate app
        chdir: "{{ restobot_deploy_path }}"
      changed_when: false

    - name: Wait until application port is reachable
      ansible.builtin.wait_for:
        port: "{{ restobot_app_port }}"
        timeout: 120
