---
- name: Prepare hosts and deploy RestoBot
  hosts: restobot
  become: true
  vars:
    restobot_deploy_path: /opt/restobot
    restobot_app_port: 8089
    restobot_owner: "{{ ansible_user | default('restobot') }}"

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install base system packages
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - python3
          - python3-apt
          - software-properties-common
        state: present

    - name: Create Docker keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker repository key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Configure Docker APT repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker Engine and Compose plugin
      ansible.builtin.apt:
        update_cache: true
        name:
          - containerd.io
          - docker-buildx-plugin
          - docker-ce
          - docker-ce-cli
          - docker-compose-plugin
        state: present

    - name: Ensure Docker service is enabled and running
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started

    - name: Add deployment user to docker group
      ansible.builtin.user:
        name: "{{ restobot_owner }}"
        groups: docker
        append: true

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ restobot_deploy_path }}"
        state: directory
        owner: "{{ restobot_owner }}"
        group: "{{ restobot_owner }}"
        mode: "0755"

    - name: Upload docker-compose file
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../docker-compose.yml"
        dest: "{{ restobot_deploy_path }}/docker-compose.yml"
        owner: "{{ restobot_owner }}"
        group: "{{ restobot_owner }}"
        mode: "0644"

    - name: Upload environment file
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../.env"
        dest: "{{ restobot_deploy_path }}/.env"
        owner: "{{ restobot_owner }}"
        group: "{{ restobot_owner }}"
        mode: "0600"

    - name: Pull application images
      ansible.builtin.command:
        cmd: docker compose pull
        chdir: "{{ restobot_deploy_path }}"
      changed_when: false

    - name: Start RestoBot stack
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: "{{ restobot_deploy_path }}"
      changed_when: false

    - name: Wait until application port is reachable
      ansible.builtin.wait_for:
        port: "{{ restobot_app_port }}"
        timeout: 120
